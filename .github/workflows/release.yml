name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a package without a tag
        required: true
        default: 0.0.0-dev

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 本仓
        uses: actions/checkout@v4
        with:
          path: provider

      # Provider 编译到契约；共享层不进 Provider 包（ADR-0036）。
      - name: 契约
        uses: actions/checkout@v4
        with:
          repository: HosihikariFramework/Abstractions
          path: Hosihikari.Abstractions

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 版本
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包
        shell: pwsh
        working-directory: provider
        run: ./pack.ps1 -Version "${{ steps.version.outputs.value }}" -OutputRoot artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: provider/artifacts/*.zip

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: provider/artifacts/*.zip
          body: |
            See the framework release notes:
            https://github.com/HosihikariFramework/Design/blob/main/docs/release-notes/first-release.md
