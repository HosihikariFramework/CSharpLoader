name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a package without a tag
        required: true
        default: 0.0.0-dev

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 本仓
        uses: actions/checkout@v7
        with:
          path: provider

      # Loader 编译到契约；共享层不进 Loader 包（ADR-0036）。
      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions

      # 打包器在核心仓；共享层清单由它统一给出（ADR-0036）。
      - name: 核心打包器
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager

      # 核心的 RID 优先解析需要 fork。
      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: McMaster.NETCore.Plugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 校验 tooth JSON
        shell: bash
        working-directory: provider
        run: jq empty tooth.json

      - name: 版本
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 校验 tooth 版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: provider
        run: |
          tooth=$(jq -r .version tooth.json)
          if [ "$tooth" != "${{ steps.version.outputs.value }}" ]; then
            echo "tooth.json 是 $tooth，标签版本是 ${{ steps.version.outputs.value }}"
            exit 1
          fi

      - name: 打包
        shell: pwsh
        working-directory: provider
        run: ./pack.ps1 -Version "${{ steps.version.outputs.value }}" -OutputRoot artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: provider/artifacts/*.zip

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: provider/artifacts/*.zip
          body: |
            See the release notes:
            https://hosihikariframework.github.io/releases/
