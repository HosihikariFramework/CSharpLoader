name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a package without a tag
        required: true
        default: 0.0.0-dev

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: 本仓
        uses: actions/checkout@v7
        with:
          path: provider

      # Loader 编译到契约；共享层不进 Loader 包（ADR-0036）。
      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions

      # 打包器在核心仓；共享层清单由它统一给出（ADR-0036）。
      - name: 核心打包器
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager

      # 核心的 RID 优先解析需要 fork。
      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: McMaster.NETCore.Plugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 版本
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包
        shell: pwsh
        working-directory: provider
        run: ./pack.ps1 -Version "${{ steps.version.outputs.value }}" -OutputRoot artifacts

      - name: 检查附件形状
        shell: bash
        working-directory: provider
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          zip="artifacts/hosihikari-csharp-$VERSION.zip"
          unzip -l "$zip" | grep -q 'plugins/hosihikari-csharp/'
          test "$(unzip -p "$zip" sei.json | jq -r .name)" = hosihikari-csharp
          test "$(unzip -p "$zip" sei.json | jq -r .version)" = "$VERSION"
          test "$(unzip -p "$zip" sei.json | jq -r .layout)" = root

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: provider/artifacts/*.zip

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: provider/artifacts/*.zip
          body: |
            See the release notes:
            https://hf.srcz.one/releases/

      # 发布后把这一版作为 sei 提交给官方索引。跨仓提交用 SEI_SUBMISSION_TOKEN；
      # 没配就跳过，不让发版失败。
      - name: 提交 SeiIndex
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.SEI_SUBMISSION_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
          NAME: hosihikari-csharp
          INDEX_REPO: Hosihikari/SeiIndex
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::SEI_SUBMISSION_TOKEN 未配置，跳过 SeiIndex 提交"
            exit 0
          fi

          asset="hosihikari-csharp-$VERSION.zip"
          file="provider/artifacts/$asset"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/$asset"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          size=$(wc -c < "$file")
          title="[sei] $NAME $VERSION"

          existing=$(gh issue list --repo "$INDEX_REPO" --state all --limit 200 \
            --json title --jq '.[].title' | grep -Fxc "$title" || true)
          if [ "$existing" != "0" ]; then
            echo "::notice::SeiIndex already has an issue titled '$title'"
            exit 0
          fi

          body=$(cat <<EOF
          ### Sei name

          $NAME

          ### Version entry (JSON)

          \`\`\`json
          {
            "version": "$VERSION",
            "dependencies": [
              { "name": "hosihikari", "version": "[1.2.0,2.0.0)" }
            ],
            "artifacts": [
              {
                "layout": "root",
                "source": {
                  "url": "$url",
                  "sha256": "$sha",
                  "size": $size
                }
              }
            ]
          }
          \`\`\`
          EOF
          )

          gh issue create --repo "$INDEX_REPO" --title "$title" --body "$body"
