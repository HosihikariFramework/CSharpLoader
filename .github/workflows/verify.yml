name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assertions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 本仓
        uses: actions/checkout@v7
        with:
          path: provider

      # 验证宿主借核心的 PluginManager。它按 ../.. 找这个目录，所以位置要照着摆。
      - name: 核心
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          path: Hosihikari.PluginManager

      # 契约与核心一起改：并列摆放才能编到新契约。
      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Hosihikari.Abstractions

      # 本机库的 RID 优先解析需要 fork；核心按 ../.. 找它。
      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/Hosihikari.McMaster.NETCore.Plugins
          path: Hosihikari.McMaster.NETCore.Plugins

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 跑断言
        working-directory: provider
        run: dotnet run --project host/Hosihikari.PluginLoader.CSharp.Host.csproj -c Release --nologo
